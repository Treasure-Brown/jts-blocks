<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <title>TB Arcade</title>
    <meta name="description" content="Short color-tile games: Blocks, Flood, Lights, and Pairs." />
    <meta name="theme-color" content="#f3eee6" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TB Arcade" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="stylesheet" href="css/style.css?v=5" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  </head>
  <body class="lobby">
    <div class="sparkle sparkle-a" aria-hidden="true"></div>
    <div class="sparkle sparkle-b" aria-hidden="true"></div>
    <div class="sparkle sparkle-c" aria-hidden="true"></div>

    <div class="app">
      <header class="top">
        <h1 class="logo">
          <span class="logo-strong">TB</span>
          <span class="logo-script">Arcade</span>
        </h1>
      </header>

      <p class="lobby-copy">Same tiles. Short games. Built for a phone in one sitting.</p>

      <nav class="arcade" aria-label="Games">
        <a class="game-card" href="blocks.html">
          <div class="mini" style="--cols: 4; --rows: 2">
            <span class="block c1" style="--r: 0; --c: 0"><span class="face"></span></span>
            <span class="block c1" style="--r: 0; --c: 1"><span class="face"></span></span>
            <span class="block c2" style="--r: 0; --c: 2"><span class="face"></span></span>
            <span class="block mixer" style="--r: 0; --c: 3"><span class="face"></span></span>
            <span class="block c5" style="--r: 1; --c: 0"><span class="face"></span></span>
            <span class="block c3" style="--r: 1; --c: 1"><span class="face"></span></span>
            <span class="block c3" style="--r: 1; --c: 2"><span class="face"></span></span>
            <span class="block c4" style="--r: 1; --c: 3"><span class="face"></span></span>
          </div>
          <h2>Blocks</h2>
          <p>Clear groups. Beat the quota.</p>
        </a>

        <a class="game-card" href="flood.html">
          <div class="mini" style="--cols: 4; --rows: 2">
            <span class="block c2" style="--r: 0; --c: 0"><span class="face"></span></span>
            <span class="block c2" style="--r: 0; --c: 1"><span class="face"></span></span>
            <span class="block c1" style="--r: 0; --c: 2"><span class="face"></span></span>
            <span class="block c3" style="--r: 0; --c: 3"><span class="face"></span></span>
            <span class="block c2" style="--r: 1; --c: 0"><span class="face"></span></span>
            <span class="block c5" style="--r: 1; --c: 1"><span class="face"></span></span>
            <span class="block c4" style="--r: 1; --c: 2"><span class="face"></span></span>
            <span class="block c1" style="--r: 1; --c: 3"><span class="face"></span></span>
          </div>
          <h2>Flood</h2>
          <p>One color. Few moves.</p>
        </a>

        <a class="game-card" href="lights.html">
          <div class="mini" style="--cols: 4; --rows: 2">
            <span class="block on" style="--r: 0; --c: 0"><span class="face"></span></span>
            <span class="block off" style="--r: 0; --c: 1"><span class="face"></span></span>
            <span class="block on" style="--r: 0; --c: 2"><span class="face"></span></span>
            <span class="block on" style="--r: 0; --c: 3"><span class="face"></span></span>
            <span class="block off" style="--r: 1; --c: 0"><span class="face"></span></span>
            <span class="block on" style="--r: 1; --c: 1"><span class="face"></span></span>
            <span class="block off" style="--r: 1; --c: 2"><span class="face"></span></span>
            <span class="block off" style="--r: 1; --c: 3"><span class="face"></span></span>
          </div>
          <h2>Lights</h2>
          <p>Tap a tile. Neighbors flip too.</p>
        </a>

        <a class="game-card" href="pairs.html">
          <div class="mini" style="--cols: 4; --rows: 2">
            <span class="block down" style="--r: 0; --c: 0"><span class="face"></span></span>
            <span class="block c3" style="--r: 0; --c: 1"><span class="face"></span></span>
            <span class="block down" style="--r: 0; --c: 2"><span class="face"></span></span>
            <span class="block c5" style="--r: 0; --c: 3"><span class="face"></span></span>
            <span class="block c1" style="--r: 1; --c: 0"><span class="face"></span></span>
            <span class="block down" style="--r: 1; --c: 1"><span class="face"></span></span>
            <span class="block c3" style="--r: 1; --c: 2"><span class="face"></span></span>
            <span class="block down" style="--r: 1; --c: 3"><span class="face"></span></span>
          </div>
          <h2>Pairs</h2>
          <p>Flip two. Match the marks.</p>
        </a>
      </nav>
    </div>
  </body>
</html>
